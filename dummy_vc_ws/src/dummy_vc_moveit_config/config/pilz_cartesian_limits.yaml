# Limits for the Pilz planner.
#
# This file exists because moveit_configs_utils loads it UNCONDITIONALLY:
# `MoveItConfigsBuilder.to_moveit_configs()` pulls it in as one of the default
# parameter files, whether or not any Pilz pipeline is configured. If it is absent
# the whole launch dies at load time with
#
#   ParameterBuilderFileNotFoundError:
#     "File <share>/dummy_vc_moveit_config/config/pilz_cartesian_limits.yaml
#      doesn't exist"
#
# which looks like a launch syntax error but is not.
#
# No Pilz pipeline is configured (planning_pipelines is `ompl` only), so the values
# below are inert; the file is here to satisfy the loader.
#
# They are the upstream defaults that ship with the MoveIt 2 test configs, in the
# four-key shape the Setup Assistant generates -- not derived for this arm. If
# Pilz is ever enabled they become live and must be re-derived: the arm reaches
# roughly 0.35 m to the TCP, so 1.0 m/s is far faster than joint_limits.yaml
# allows.
#
# Keep the top-level `cartesian_limits` key: the Pilz planner reads this exact
# parameter namespace.
cartesian_limits:
  max_trans_vel: 1.0
  max_trans_acc: 2.25
  max_trans_dec: -5.0
  max_rot_vel: 1.57
