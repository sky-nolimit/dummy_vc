# How MoveIt sends a planned trajectory to the driver.
#
# ★ 重要：MoveIt 的控制器插件只会通过 **action** 下发轨迹（FollowJointTrajectory
# 或 GripperCommand），没有"只发 topic"的内置类型。驱动原来只有一条
# trajectory_msgs/JointTrajectory **订阅**：
#
#     topic     /joint_trajectory_controller/joint_trajectory
#     type      trajectory_msgs/JointTrajectory
#     timing    it sleeps until each waypoint's time_from_start is due, then
#               sends that waypoint
#
# 所以**规划（demo）没问题、执行（真机）走不通**：MoveIt 会去找
# /joint_trajectory_controller/follow_joint_trajectory 这个 action server，
# 驱动原来没有，于是不会真正动。这不是配置错误，是接口形态不匹配。
#
# **驱动侧已补上**：dummy_controller 现在创建 FollowJointTrajectory action
# server（trajectory_action_enable 默认 true），内部复用上面那条轨迹执行
# 逻辑，原来那条 topic 入口也保留。不是给 MoveIt 写插件。
#
# 这里仍然要写对 type，否则 move_group 会当作"没有控制器"（见下面的注释），
# 连规划组和控制器都关联不上。

trajectory_execution:
  # Give a trajectory time to start moving before declaring failure.
  allowed_start_tolerance: 0.05
  # MoveIt raises an error if execution overruns the planned duration by more
  # than these factors. The arm is SLOW, and its real speed is not modelled by
  # MoveIt's velocity limits (the driver does not implement them), so without
  # generous scaling every execution would look like an overrun.
  #
  # This is the single most likely knob to need tuning: if you see
  # "Execution completed with error" while the arm is moving fine, raise these.
  allowed_execution_duration_scaling: 10.0
  allowed_goal_duration_margin: 5.0
  execution_duration_monitoring: true
  # The arm cannot be stopped instantly; killing a trajectory mid-flight would
  # leave it somewhere unplanned.
  disable_collision_checks: false
  wait_for_trajectory_completion: true

# 控制器名字与驱动的关系。
#
# FollowJointTrajectory handle 用的是
#     /<controller_name>/<action_ns>
# 也就是 /joint_trajectory_controller/follow_joint_trajectory —— **只有两段**。
# action_ns 的值本身就叫 follow_joint_trajectory，不要再补一段（重复一段和
# 少一段报的错一模一样）。参考：
# https://moveit.picknik.ai/main/doc/examples/controller_configuration/controller_configuration_tutorial.html
#
# 而驱动原来订阅的是
#     /joint_trajectory_controller/joint_trajectory
#
# 两者**对不上**，这是"接口形态不匹配"，不是名字写错：驱动是 topic，插件要
# action。**驱动侧已经补上 FollowJointTrajectory action server**（默认开，
# 名字就是上面那个，见 dummy_controller.yaml 的 trajectory_action_* 参数），
# 所以这一项不再是待办。
#
# 注意：驱动**同时**保留原来的 topic 入口（tools/ 下的脚本依赖它），所以
# `ros2 topic list` 里那条 joint_trajectory 话题还在，那是正常的。
#
# tools/check_moveit_config.py 会检查"驱动源码里有没有 action server"，并据此
# 决定要不要报这条待办；tools/selftest_follow_joint_trajectory.py 则进一步核对
# 名字是否逐字相等。

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
  joint_trajectory_controller:
    # ★ 只能是 'FollowJointTrajectory' 或 'GripperCommand'。
    #
    # 这两个字符串是 ROS 2 的 action 名（control_msgs/action/...），不是任意
    # 标识符：moveit_simple_controller_manager 用它们去查已注册的 handle 类型，
    # 写错就只是打一行
    #     [ERROR] Unknown controller type: <你写的>
    #     [INFO]  Returned 0 controllers in list
    # 然后当作"没有控制器"，不报错、不退出。
    #
    # 2026-10 这里原来写的是 'moveit_simple_controller_manager/
    # JointTrajectoryControllerHandle' —— 那是 ROS 1 的名字，MoveIt 2 里不存在。
    # 参考：https://moveit.picknik.ai/humble/doc/examples/controller_configuration/controller_configuration_tutorial.html
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - dummy2_joint1
      - dummy2_joint2
      - dummy2_joint3
      - dummy2_joint4
      - dummy2_joint5
      - dummy2_joint6

# The gripper is deliberately NOT listed.
#
# Its hand interface on the device blocks forever and produces no motion (see
# the gripper notes in the local docs/04). Registering a controller for it would let MoveIt
# believe it can grip, and a plan that includes a close command would then hang
# on a call that never returns. Leaving it out means MoveIt plans the arm only,
# which is what actually works today.
