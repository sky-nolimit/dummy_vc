# Kinematics solvers, one entry per planning group.
#
# KDL is chosen because it has no extra dependencies and is the reference
# solver. It is not the fastest or the most reliable near singularities -- if
# planning starts failing on reachable targets, the usual next step is
# TRAC-IK (trac_ik_kinematics_plugin) or pick_ik, which are drop-in
# replacements for the line below.
#
# `timeout` is how long an IK attempt may take. The Dummy arm's joints are
# slow but IK is pure computation, so this is unrelated to the arm's speed.
# `resolution` is the joint-space step for the search.

dummy_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

# gripper 故意没有条目。
#
# 逆运动学求解器只对"链"有意义，而 SRDF 里 gripper 组是两个并联的手指关节
# 按名字列出来的，不是一条链。给它配 KDL 会在 move_group 启动时报三条错：
#
#   [ERROR] Group 'gripper' is not a chain
#   [ERROR] Kinematics solver of type 'kdl_kinematics_plugin/KDLKinematicsPlugin'
#           could not be initialized for group 'gripper'
#   [ERROR] Kinematics solver could not be instantiated for joint group gripper.
#
# 这几条不影响 dummy_arm，但会让人误以为运动学配置坏了。夹爪不需要 IK：
# 它的两个关节是直接给位置（开/合），不通过末端位姿反解。
