# Kinematics solvers, one entry per planning group.
#
# KDL has no extra dependencies and is the reference solver; it is not the fastest
# or the most reliable near singularities. If planning fails on reachable targets,
# TRAC-IK (trac_ik_kinematics_plugin) or pick_ik are drop-in replacements for the
# line below.
#
# `timeout` is the IK attempt budget, unrelated to the arm's speed (IK is pure
# computation). `resolution` is the joint-space step for the search.

dummy_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

# gripper 故意没有条目。逆运动学只对"链"有意义，而 SRDF 里 gripper 组是两个
# 并联的手指关节按名字列出来的，不是一条链。给它配 KDL 会在 move_group 启动时报
# `[ERROR] Group 'gripper' is not a chain`（连带 solver 初始化两条错）：不影响
# dummy_arm，但会让人误以为运动学配置坏了。夹爪也不需要 IK：两个手指关节是直接
# 给位置（开/合），不通过末端位姿反解。
