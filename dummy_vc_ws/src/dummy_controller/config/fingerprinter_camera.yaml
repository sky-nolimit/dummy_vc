fingerprinter_cam_publisher:
  ros__parameters:
    camera_intrinsics:
      fx: 495.231697
      fy: 494.590030
      cx: 303.808212
      cy: 249.027693
    distortion:
      d1:  0.077718
      d2: -0.127016
      d3: -0.000550
      d4: -0.001023
      d5: 0.000000
    image_width: 640
    image_height: 480
    fps: 30
    # 插拔顺序一变 /dev/videoN 就换号，所以设备号放这里（python 里是 device_index）
    device_index: 6
    # 图像是光学系约定（x 右、y 下、z 朝前），frame_id 必须是 optical frame，不能写
    # camera_link —— 那等于声称像素在机身系里，针孔模型的 z 会指到侧面，投影错却
    # 不报错。usb_camera_optical_frame 是 URDF 里 camera_link 的子帧（rpy -90 0 -90）。
    # 不用 camera_color_optical_frame：那个名字归 orbbec_camera 驱动，双定义会让同
    # 一个 frame 有两个父节点。
    camera_frame_id: "usb_camera_optical_frame"
    camera_topic: "/dummy/visual/fingerprint_camera"