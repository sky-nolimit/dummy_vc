fingerprinter_cam_publisher:
  ros__parameters:
    camera_intrinsics:
      fx: 495.231697
      fy: 494.590030
      cx: 303.808212
      cy: 249.027693
    distortion:
      d1:  0.077718
      d2: -0.127016
      d3: -0.000550
      d4: -0.001023
      d5: 0.000000
    image_width: 640
    image_height: 480
    fps: 30
    # 插拔顺序一变 /dev/videoN 就换号，所以设备号放这里（python 里是 device_index）
    device_index: 6
    # 图像本身是光学系约定（x 右、y 下、z 朝前），所以 frame_id 必须是 optical
    # frame，不能写 camera_link —— 写成 camera_link 就等于声称像素在"机身"坐标系
    # 里，针孔模型的 z 会指到侧面去，投影出来的点会错得离谱却不报错。
    # usb_camera_optical_frame 是 URDF 里 camera_link 的子帧（固定 rpy -90 0 -90）。
    # 不写成 camera_color_optical_frame：那个名字归 orbbec_camera 驱动所有，
    # 两边都定义会让同一个 frame 有两个父节点。
    camera_frame_id: "usb_camera_optical_frame"
    camera_topic: "/dummy/visual/fingerprint_camera"